[package]
name = "oxaf-parse"
version = "0.1.0"
edition = "2021"
description = "Binary format parser for 0xAF-Re agent — ELF/PE/Mach-O deep analysis, diff, anti-analysis"

[[bin]]
name = "oxaf-parse"
path = "src/main.rs"

[dependencies]
goblin = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
strip = true
