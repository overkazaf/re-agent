<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111c33" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#020617"/>
  <rect width="1280" height="640" fill="url(#g)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- ============ LEFT ============ -->
  <g>
    <rect x="72" y="70" width="62" height="26" rx="5" fill="#22d3ee"/>
    <text x="103" y="89" fill="#020617" font-size="15" font-weight="700" text-anchor="middle">0xAF</text>
    <text x="146" y="89" fill="#e2e8f0" font-size="15" font-weight="700" letter-spacing="0">RE</text>
    <text x="196" y="89" fill="#334155" font-size="13">·</text>
    <text x="214" y="89" fill="#64748b" font-size="11.5">reverse ops deck · v0.1.0</text>

    <text x="72" y="176" fill="#f1f5f9" font-size="43" font-weight="700" letter-spacing="0">A reverse engineering</text>
    <text x="72" y="228" fill="#f1f5f9" font-size="43" font-weight="700" letter-spacing="0">agent that shows</text>
    <text x="72" y="280" fill="#f1f5f9" font-size="43" font-weight="700" letter-spacing="0">its <tspan fill="#22d3ee">work</tspan>.</text>

    <rect x="72" y="308" width="300" height="2.5" rx="1" fill="url(#rule)"/>

    <text x="72" y="348" fill="#94a3b8" font-size="14">A planner model and an executor model over</text>
    <text x="72" y="371" fill="#94a3b8" font-size="14"><tspan fill="#cbd5e1" font-weight="600">24 local tools</tspan>, plus RE workflow modes:</text>
    <text x="72" y="394" fill="#94a3b8" font-size="14"><tspan fill="#cbd5e1" font-weight="600">specialist</tspan> for GPT Cyber / CVP routes,</text>
    <text x="72" y="417" fill="#94a3b8" font-size="14"><tspan fill="#fbbf24" font-weight="600">caveman</tspan> evidence packets otherwise.</text>

    <!-- install line -->
    <rect x="72" y="446" width="516" height="42" rx="7" fill="#0b1220" stroke="#1e293b" stroke-width="1.2"/>
    <text x="90" y="472" fill="#34d399" font-size="13" font-weight="700">$</text>
    <text x="108" y="472" fill="#cbd5e1" font-size="12.5">go install github.com/overkazaf/re-agent/cmd/0xaf@latest</text>

    <!-- stat pills -->
    <g font-size="11.5">
      <rect x="72" y="512" width="111" height="30" rx="15" fill="#0b1220" stroke="#1e293b" stroke-width="1.1"/>
      <text x="86" y="532" fill="#94a3b8"><tspan fill="#f1f5f9" font-weight="700">6.7 ms</tspan> start</text>

      <rect x="193" y="512" width="118" height="30" rx="15" fill="#0b1220" stroke="#1e293b" stroke-width="1.1"/>
      <text x="207" y="532" fill="#94a3b8"><tspan fill="#f1f5f9" font-weight="700">6.7 MB</tspan> binary</text>

      <rect x="321" y="512" width="84" height="30" rx="15" fill="#0b1220" stroke="#1e293b" stroke-width="1.1"/>
      <text x="335" y="532" fill="#94a3b8"><tspan fill="#f1f5f9" font-weight="700">24</tspan> tools</text>

      <rect x="415" y="512" width="104" height="30" rx="15" fill="#0b1220" stroke="#1e293b" stroke-width="1.1"/>
      <text x="429" y="532" fill="#94a3b8"><tspan fill="#f1f5f9" font-weight="700">8</tspan> providers</text>

      <rect x="529" y="512" width="112" height="30" rx="15" fill="#0b1220" stroke="#1e293b" stroke-width="1.1"/>
      <text x="543" y="532" fill="#94a3b8"><tspan fill="#f1f5f9" font-weight="700">3</tspan> workflows</text>
    </g>

    <text x="72" y="586" fill="#475569" font-size="11.5">github.com/overkazaf/re-agent</text>
  </g>

  <!-- ============ RIGHT — a real mid-turn frame ============ -->
  <g>
    <rect x="700" y="92" width="508" height="456" rx="12" fill="#0b0f14" stroke="#1e293b" stroke-width="1.3"/>
    <rect x="700" y="92" width="508" height="34" rx="12" fill="#0f172a"/>
    <rect x="700" y="114" width="508" height="12" fill="#0f172a"/>
    <circle cx="722" cy="109" r="5" fill="#ff5f57"/>
    <circle cx="740" cy="109" r="5" fill="#febc2e"/>
    <circle cx="758" cy="109" r="5" fill="#28c840"/>
    <text x="780" y="113" fill="#475569" font-size="10">a real mid-turn frame · 100×40 pty</text>

    <!-- dataflow row -->
    <g font-size="11.5">
      <text x="724" y="164" fill="#22d3ee" font-weight="700">[you]</text>
      <line x1="778" y1="160" x2="856" y2="160" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
      <circle cx="812" cy="160" r="2.6" fill="#22d3ee"/>
      <text x="866" y="164" fill="#a78bfa" font-weight="700">[ctx]</text>
      <line x1="918" y1="160" x2="1006" y2="160" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
      <circle cx="962" cy="160" r="2.6" fill="#a78bfa"/>
      <text x="1016" y="164" fill="#34d399" font-weight="700">((codex))</text>

      <text x="724" y="184" fill="#475569" font-size="9.5">3 msg</text>
      <text x="866" y="184" fill="#475569" font-size="9.5">147 tok</text>
      <text x="1016" y="184" fill="#64748b" font-size="9.5">awaiting tools</text>

      <text x="724" y="216" fill="#fbbf24" font-weight="700">[plan 1/4]</text>
      <text x="866" y="216" fill="#34d399" font-weight="700">[tools]</text>
      <line x1="1002" y1="212" x2="928" y2="212" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
      <circle cx="964" cy="212" r="2.6" fill="#34d399"/>
      <text x="1016" y="216" fill="#64748b">[calls×1]</text>
      <text x="866" y="236" fill="#cbd5e1" font-size="10">run_command <tspan fill="#64748b">2.1s</tspan> <tspan fill="#34d399">✓1</tspan></text>
    </g>

    <!-- HUD box -->
    <rect x="722" y="258" width="464" height="266" rx="8" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="738" y="250" width="86" height="18" rx="4" fill="#0b0f14"/>
    <text x="746" y="264" fill="#22d3ee" font-size="10.5" font-weight="700">0xAF·RE</text>

    <text x="742" y="294" fill="#34d399" font-size="11" font-weight="700">codex</text>
    <text x="796" y="294" fill="#475569" font-size="10">→</text>
    <text x="816" y="294" fill="#34d399" font-size="11" font-weight="700">claude</text>
    <rect x="1060" y="286" width="72" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="1060" y="286" width="18" height="7" rx="3.5" fill="#22d3ee"/>
    <text x="1142" y="294" fill="#94a3b8" font-size="10">25%</text>

    <text x="742" y="322" fill="#64748b" font-size="10.5">the checker looks like sub_401a20</text>

    <g font-size="11">
      <text x="742" y="356" fill="#34d399">✔</text>
      <text x="762" y="356" fill="#64748b">triage: file / arch / packer</text>
      <text x="1096" y="356" fill="#475569" font-size="10">2.3s</text>

      <text x="742" y="384" fill="#fbbf24">▸</text>
      <text x="762" y="384" fill="#f1f5f9" font-weight="600">locate the check and reproduce it</text>
      <text x="1096" y="384" fill="#475569" font-size="10">2.2s</text>

      <text x="742" y="412" fill="#334155">○</text>
      <text x="762" y="412" fill="#475569">reproduce the flag path</text>

      <text x="742" y="440" fill="#334155">○</text>
      <text x="762" y="440" fill="#475569">write reproducible notes</text>
    </g>

    <line x1="742" y1="464" x2="1166" y2="464" stroke="#131c2b" stroke-width="1"/>
    <text x="742" y="490" fill="#475569" font-size="10">queue next task · edit before run</text>
    <text x="1166" y="490" fill="#475569" font-size="10" text-anchor="end">fold / expand live tasks</text>

    <!-- Xiaohongshu group QR, baked into social-card.png for direct sharing. -->
    <g>
      <rect x="1028" y="374" width="152" height="152" rx="12" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="1104" y="396" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="11" font-weight="700" text-anchor="middle">小红书扫码进群</text>
      <rect x="1054" y="407" width="100" height="100" rx="7" fill="#f8fafc"/>
      <image href="xhs-group-qr-crop.png" x="1059" y="412" width="90" height="90" preserveAspectRatio="xMidYMid meet"/>
      <text x="1104" y="518" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="9.5" text-anchor="middle">valid through 2026-08-25</text>
    </g>
  </g>
</svg>
