<text y="79.4" xml:space="preserve"><tspan x="16.0" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">─────────────</tspan><tspan x="125.2" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#0e7490">─────────────</tspan><tspan x="234.4" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#334155">──────────────────────────</tspan></text>
