<text y="459.4" xml:space="preserve"><tspan x="32.8" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/role</tspan><tspan x="83.2" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">planner|executor|auto</tspan><tspan x="352.0" textLength="294.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Pick which side of the deck answers</tspan></text>
