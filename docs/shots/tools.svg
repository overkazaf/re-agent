<svg xmlns="http://www.w3.org/2000/svg" width="872" height="1447" viewBox="0 0 872 1447" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace' font-size="13.5">
<rect width="100%" height="100%" rx="10" fill="#0b0f14"/>
<rect x="0.5" y="0.5" width="99.9%" height="99.5%" rx="10" fill="none" stroke="#1e2936"/>
<text x="16" y="30.1" fill="#64748b" font-size="12">auto/auto ❯ /tools</text>
<text y="60.4" xml:space="preserve"><tspan x="16.0" textLength="42.0" lengthAdjust="spacingAndGlyphs" font-weight="700" fill="#22d3ee">TOOLS</tspan></text>
<text y="79.4" xml:space="preserve"><tspan x="16.0" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">─────────────────────────</tspan><tspan x="226.0" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#0e7490">─────────────────────────</tspan><tspan x="436.0" textLength="420.0" lengthAdjust="spacingAndGlyphs" fill="#334155">──────────────────────────────────────────────────</tspan></text>
<text y="98.4" xml:space="preserve"><tspan x="16.0" textLength="159.6" lengthAdjust="spacingAndGlyphs" fill="#64748b">TOOL               </tspan><tspan x="192.4" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#64748b">RISK </tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#64748b">DESCRIPTION                                                             </tspan></text>
<text y="155.4" xml:space="preserve"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">list_files</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">List files under the workspace, optionally recursively. Useful for CTF a</tspan></text>
<text y="174.4" xml:space="preserve"><tspan x="16.0" textLength="126.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">rtifact triage.</tspan></text>
<text y="212.4" xml:space="preserve"><tspan x="16.0" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">read_file</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Read a workspace file as UTF-8 text with truncation. For binary files us</tspan></text>
<text y="231.4" xml:space="preserve"><tspan x="16.0" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">e hexdump or strings.</tspan></text>
<text y="269.4" xml:space="preserve"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">write_file</tspan><tspan x="192.4" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#fbbf24">write</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Write a workspace file. Disabled unless the CLI is started with --write.</tspan></text>
<text y="326.4" xml:space="preserve"><tspan x="16.0" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">grep</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Search text files using ripgrep when available. Falls back to a simple r</tspan></text>
<text y="345.4" xml:space="preserve"><tspan x="16.0" textLength="117.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">ecursive scan.</tspan></text>
<text y="383.4" xml:space="preserve"><tspan x="16.0" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">run_command</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">exec</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Run a local workspace command for CTF/reverse engineering. Network and d</tspan></text>
<text y="402.4" xml:space="preserve"><tspan x="16.0" textLength="361.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">estructive commands are blocked by default.</tspan></text>
<text y="440.4" xml:space="preserve"><tspan x="16.0" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">file_info</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="302.4" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Run file(1) on a workspace artifact.</tspan></text>
<text y="497.4" xml:space="preserve"><tspan x="16.0" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">strings</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="411.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Extract printable strings from a binary artifact.</tspan></text>
<text y="554.4" xml:space="preserve"><tspan x="16.0" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">hexdump</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="319.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show a hex dump from a workspace file.</tspan></text>
<text y="611.4" xml:space="preserve"><tspan x="16.0" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">hash_file</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="403.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Calculate SHA-256 and size for a workspace file.</tspan></text>
<text y="668.4" xml:space="preserve"><tspan x="16.0" textLength="126.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">extract_symbols</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="588.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Try common symbol/import table tools: nm, readelf, objdump, and otool.</tspan></text>
<text y="725.4" xml:space="preserve"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">ctf_triage</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Fast offline CTF artifact triage: file type, magic, hash, entropy, strin</tspan></text>
<text y="744.4" xml:space="preserve"><tspan x="16.0" textLength="546.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">g categories, flag/URL/encoding hints, and next-step suggestions.</tspan></text>
<text y="782.4" xml:space="preserve"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">ctf_decode</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Decode common CTF encodings and small XOR layers: auto, base64, base64ur</tspan></text>
<text y="801.4" xml:space="preserve"><tspan x="16.0" textLength="546.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">l, hex, URL, ROT13, XOR with key, or single-byte XOR brute force.</tspan></text>
<text y="839.4" xml:space="preserve"><tspan x="16.0" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">entropy_scan</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Scan a file with sliding-window entropy to spot packed, encrypted, compr</tspan></text>
<text y="858.4" xml:space="preserve"><tspan x="16.0" textLength="327.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">essed, or unusually structured regions.</tspan></text>
<text y="896.4" xml:space="preserve"><tspan x="16.0" textLength="151.2" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">binary_mitigations</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Summarize binary security posture for ELF/Mach-O/PE artifacts: arch, PIE</tspan></text>
<text y="915.4" xml:space="preserve"><tspan x="16.0" textLength="571.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">, NX, canary, RELRO, stripped, and dangerous imports when available.</tspan></text>
<text y="953.4" xml:space="preserve"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">find_bytes</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Find text, hex, or regex byte/string patterns in a workspace file and re</tspan></text>
<text y="972.4" xml:space="preserve"><tspan x="16.0" textLength="302.4" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">port offsets with hex/ascii context.</tspan></text>
<text y="1010.4" xml:space="preserve"><tspan x="16.0" textLength="126.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">carve_artifacts</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Locate embedded file signatures such as ELF, PE, ZIP, DEX, PNG, JPEG, PD</tspan></text>
<text y="1029.4" xml:space="preserve"><tspan x="16.0" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">F, SQLite, gzip, Mach-O; optionally extract slices with --write enabled.</tspan></text>
<text y="1067.4" xml:space="preserve"><tspan x="16.0" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">apk_inspect</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Inspect APK/ZIP structure for DEX files, native libraries, packer signat</tspan></text>
<text y="1086.4" xml:space="preserve"><tspan x="16.0" textLength="613.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">ures, frameworks, manifest/resources, and likely Android reverse targets.</tspan></text>
<text y="1124.4" xml:space="preserve"><tspan x="16.0" textLength="159.6" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">frida_hook_template</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Generate a Frida hook scaffold for Android Java, Android native export/a</tspan></text>
<text y="1143.4" xml:space="preserve"><tspan x="16.0" textLength="831.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">ddress, or iOS Objective-C targets. Writes only when outputPath is provided and --write is enabled.</tspan></text>
<text y="1181.4" xml:space="preserve"><tspan x="16.0" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">list_skills</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">List project-local built-in reverse engineering skills available to this</tspan></text>
<text y="1200.4" xml:space="preserve"><tspan x="16.0" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8"> agent.</tspan></text>
<text y="1238.4" xml:space="preserve"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">read_skill</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="445.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Read one project-local built-in skill by name or tag.</tspan></text>
<text y="1295.4" xml:space="preserve"><tspan x="16.0" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">knowledge_search</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Search the local reverse-engineering knowledge index and return an agent</tspan></text>
<text y="1314.4" xml:space="preserve"><tspan x="16.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">-ready digest. After calling it, synthesize a structured answer with conclusion, steps, pitfalls, an</tspan></text>
<text y="1333.4" xml:space="preserve"><tspan x="16.0" textLength="386.4" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">d cited entry ids instead of dumping raw hits.</tspan></text>
<text y="1352.4" xml:space="preserve"><tspan x="16.0" textLength="117.6" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">knowledge_read</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Read one entry from the local reverse-engineering knowledge index by id.</tspan></text>
<text y="1409.4" xml:space="preserve"><tspan x="16.0" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb">update_plan</tspan><tspan x="192.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#4ade80">read</tspan><tspan x="251.2" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Publish or update the task list the operator sees. Call it once up front</tspan></text>
<text y="1428.4" xml:space="preserve"><tspan x="16.0" textLength="840.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8"> for any multi-step task, then again whenever a step changes status. Always send the whole list, not</tspan></text>
