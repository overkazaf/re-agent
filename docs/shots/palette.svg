<text y="117.4" xml:space="preserve"><tspan x="32.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/</tspan><tspan x="318.4" textLength="252.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show executable slash commands</tspan></text>
<text y="136.4" xml:space="preserve"><tspan x="32.8" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/welcome</tspan><tspan x="318.4" textLength="226.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show guided first-run demos</tspan></text>
<text y="155.4" xml:space="preserve"><tspan x="32.8" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/help</tspan><tspan x="318.4" textLength="117.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show this deck</tspan></text>
<text y="174.4" xml:space="preserve"><tspan x="32.8" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/clear</tspan><tspan x="318.4" textLength="319.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Clear the screen and redraw the banner</tspan></text>
<text y="193.4" xml:space="preserve"><tspan x="32.8" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/theme</tspan><tspan x="91.6" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">[name]</tspan><tspan x="318.4" textLength="327.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Switch palette (deck/amber/matrix/mono)</tspan></text>
<text y="212.4" xml:space="preserve"><tspan x="32.8" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/flow</tspan><tspan x="83.2" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">[full|flow|trace|off]</tspan><tspan x="318.4" textLength="310.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Live dataflow diagram and trace lines</tspan></text>
<text y="231.4" xml:space="preserve"><tspan x="32.8" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/context</tspan><tspan x="318.4" textLength="369.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show the context estimate against the budget</tspan></text>
<text y="250.4" xml:space="preserve"><tspan x="32.8" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/compact</tspan><tspan x="108.4" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">[provider]</tspan><tspan x="318.4" textLength="403.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Fold the session into a summary and free context</tspan></text>
<text y="269.4" xml:space="preserve"><tspan x="32.8" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/session</tspan><tspan x="318.4" textLength="260.4" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Print the JSONL transcript path</tspan></text>
<text y="288.4" xml:space="preserve"><tspan x="32.8" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/sessions</tspan><tspan x="318.4" textLength="168.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">List recent sessions</tspan></text>
<text y="307.4" xml:space="preserve"><tspan x="32.8" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/resume</tspan><tspan x="100.0" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">[id]</tspan><tspan x="318.4" textLength="277.2" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Load a previous session&#x27;s history</tspan></text>
<text y="326.4" xml:space="preserve"><tspan x="32.8" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/policy</tspan><tspan x="318.4" textLength="243.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show the active safety policy</tspan></text>
<text y="345.4" xml:space="preserve"><tspan x="32.8" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/approval</tspan><tspan x="116.8" textLength="184.8" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">[mode|tool &lt;n&gt; allow|…</tspan><tspan x="318.4" textLength="420.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show or change tool approval (yolo/write/always-a…</tspan></text>
<text y="364.4" xml:space="preserve"><tspan x="32.8" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/exit</tspan><tspan x="318.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Quit</tspan></text>
<text y="383.4" xml:space="preserve"><tspan x="32.8" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/quit</tspan><tspan x="318.4" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Quit</tspan></text>
<text y="402.4" xml:space="preserve"><tspan x="32.8" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/role</tspan><tspan x="83.2" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">planner|executor|auto</tspan><tspan x="318.4" textLength="294.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Pick which side of the deck answers</tspan></text>
<text y="421.4" xml:space="preserve"><tspan x="32.8" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/agent</tspan><tspan x="91.6" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">&lt;name&gt;|auto</tspan><tspan x="318.4" textLength="310.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Pin one provider for the next prompts</tspan></text>
<text y="440.4" xml:space="preserve"><tspan x="32.8" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/planner</tspan><tspan x="108.4" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">&lt;name&gt;</tspan><tspan x="318.4" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Set the planner provider</tspan></text>
<text y="459.4" xml:space="preserve"><tspan x="32.8" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/executor</tspan><tspan x="116.8" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">&lt;name&gt;</tspan><tspan x="318.4" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Set the executor provider</tspan></text>
<text y="478.4" xml:space="preserve"><tspan x="32.8" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/effort</tspan><tspan x="100.0" textLength="151.2" lengthAdjust="spacingAndGlyphs" fill="#a78bfa">&lt;provider&gt; &lt;level&gt;</tspan><tspan x="318.4" textLength="285.6" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Set reasoning effort (minimal…max)</tspan></text>
<text y="497.4" xml:space="preserve"><tspan x="32.8" textLength="84.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/providers</tspan><tspan x="318.4" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">List configured providers</tspan></text>
<text y="516.4" xml:space="preserve"><tspan x="32.8" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/auth</tspan><tspan x="318.4" textLength="184.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show credential status</tspan></text>
<text y="535.4" xml:space="preserve"><tspan x="32.8" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">/status</tspan><tspan x="318.4" textLength="184.8" lengthAdjust="spacingAndGlyphs" fill="#94a3b8">Show credential status</tspan></text>
