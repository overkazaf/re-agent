<svg xmlns="http://www.w3.org/2000/svg" width="872" height="611" viewBox="0 0 872 611" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace' font-size="13.5">
