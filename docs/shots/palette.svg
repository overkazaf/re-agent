<text x="16" y="30.1" fill="#64748b" font-size="12">the slash palette, drawn under the prompt while you type</text>
<text y="60.4" xml:space="preserve"><tspan x="16.0" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#64748b">auto</tspan><tspan x="49.6" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#334155">/</tspan><tspan x="58.0" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">auto</tspan><tspan x="100.0" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#22d3ee">❯</tspan><tspan x="108.4" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#e5e7eb"> /exit</tspan></text>
