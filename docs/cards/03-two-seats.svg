<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f1a2e" stroke-width="1"/></pattern></defs><rect width="1080" height="1440" fill="#020617"/><rect width="1080" height="1440" fill="url(#g)"/><rect x="84" y="96" width="7" height="26" rx="3.5" fill="#34d399"/><text x="106" y="117" fill="#34d399" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="0">PRINCIPLE 01</text><text x="996" y="117" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" text-anchor="end">02 / 10</text><text x="84" y="250" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="64" font-weight="700" letter-spacing="0">Two seats,</text><text x="84" y="328" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="64" font-weight="700" letter-spacing="0">one loop.</text><rect x="84" y="458" width="260" height="3" rx="1.5" fill="#34d399"/><text x="84" y="533" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">A planner reasons about the target. An executor</text><text x="84" y="583" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">drives the tools. They are different jobs —</text><text x="84" y="633" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">one wants divergence, the other wants compliance.</text><rect x="84" y="709" width="912" height="219" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/><text x="110" y="768" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"><tspan fill="#22d3ee">/planner  </tspan><tspan fill="#cbd5e1" font-weight="700">codex</tspan><tspan fill="#64748b">      --sandbox read-only</tspan></text><text x="110" y="810" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"><tspan fill="#22d3ee">/executor </tspan><tspan fill="#cbd5e1" font-weight="700">claude</tspan><tspan fill="#64748b">     tool calls land more reliably</tspan></text><text x="110" y="852" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"></text><text x="110" y="894" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"><tspan fill="#22d3ee">/planner  </tspan><tspan fill="#cbd5e1" font-weight="700">grok-cli</tspan><tspan fill="#64748b">   swap mid-run, no restart</tspan></text><text x="84" y="1010" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">Neither seat is bound to a vendor: any of 8 providers</text><text x="84" y="1048" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">takes either one, and they mix — a local CLI planning</text><text x="84" y="1086" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">while a direct API executes.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" fill="#f1f5f9" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="0">RE</text><text x="996" y="1370" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" text-anchor="end">github.com/overkazaf/re-agent</text></svg>