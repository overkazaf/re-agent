<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f1a2e" stroke-width="1"/></pattern></defs><rect width="1080" height="1440" fill="#020617"/><rect width="1080" height="1440" fill="url(#g)"/><rect x="84" y="96" width="7" height="26" rx="3.5" fill="#fbbf24"/><text x="106" y="117" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="0">IN PRACTICE</text><text x="996" y="117" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" text-anchor="end">07 / 10</text><text x="84" y="250" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">When the</text><text x="84" y="326" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">model says no.</text><rect x="84" y="454" width="260" height="3" rx="1.5" fill="#fbbf24"/><text x="84" y="529" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">Vendors differ sharply on reverse-engineering requests,</text><text x="84" y="579" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">and the same vendor drifts over time. Refusal is a</text><text x="84" y="629" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">normal operating condition here, not an incident.</text><circle cx="91" cy="697" r="6" fill="#fb7185"/><text x="114" y="705" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">Refused  </tspan><tspan fill="#94a3b8">— stop_reason=refusal, turn wasted</tspan></text><circle cx="91" cy="781" r="6" fill="#fbbf24"/><text x="114" y="789" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">Softened  </tspan><tspan fill="#94a3b8">— generic advice, dodges the check</tspan></text><circle cx="91" cy="865" r="6" fill="#34d399"/><text x="114" y="873" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">Answered  </tspan><tspan fill="#94a3b8">— what you were hoping for</tspan></text><rect x="84" y="949" width="912" height="91" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/><text x="110" y="1006" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="23" xml:space="preserve"><tspan fill="#22d3ee" font-weight="700">/agent grok</tspan><tspan fill="#64748b">      different policy boundary</tspan></text><text x="84" y="1122" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">So the architecture leaves an exit: refusal is a first-class</text><text x="84" y="1160" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">failure cause, providers swap without a restart, and the</text><text x="84" y="1198" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">triage path never touches a model at all.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" fill="#f1f5f9" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="0">RE</text><text x="996" y="1370" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" text-anchor="end">github.com/overkazaf/re-agent</text></svg>