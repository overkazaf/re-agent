nospace" font-size="25" xml:space="preserve"><tspan fill="#fb7185" font-weight="700">REVIEW</tspan><tspan fill="#cbd5e1" font-weight="700">  run_command</tspan><tspan fill="#64748b">   tier=exec</tspan></text><text x="110" y="760" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"><tspan fill="#cbd5e1">  curl https://api.example.com/sign</tspan></text><text x="110" y="802" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"><tspan fill="#fb7185">  ! network command · needs --allow-network</tspan></text><text x="110" y="844" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"><tspan fill="#64748b">  y once   a always   n skip   d never</tspan></text><text x="84" y="960" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">Safety patterns outrank a standing allow: permitting</text><text x="84" y="998" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">run_command is not permitting rm -rf /. With nobody</text><text x="84" y="1036" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">attached, the gate denies rather than assumes.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" 