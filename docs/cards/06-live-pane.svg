<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f1a2e" stroke-width="1"/></pattern></defs><rect width="1080" height="1440" fill="#020617"/><rect width="1080" height="1440" fill="url(#g)"/><rect x="84" y="96" width="7" height="26" rx="3.5" fill="#22d3ee"/><text x="106" y="117" fill="#22d3ee" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="0">PRINCIPLE 04</text><text x="996" y="117" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" text-anchor="end">05 / 10</text><text x="84" y="250" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">Decoration</text><text x="84" y="326" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">must never</text><text x="84" y="402" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">fail a run.</text><rect x="84" y="530" width="260" height="3" rx="1.5" fill="#22d3ee"/><text x="84" y="605" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">The live pane redraws every 90 ms. When the terminal</text><text x="84" y="655" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">is too narrow it sheds detail in a fixed order rather</text><text x="84" y="705" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">than wrap, overflow, or crash the turn:</text><circle cx="91" cy="773" r="6" fill="#64748b"/><text x="114" y="781" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">1 </tspan><tspan fill="#94a3b8">— the reasoning tail goes first</tspan></text><circle cx="91" cy="857" r="6" fill="#64748b"/><text x="114" y="865" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">2 </tspan><tspan fill="#94a3b8">— then the plan note</tspan></text><circle cx="91" cy="941" r="6" fill="#64748b"/><text x="114" y="949" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">3 </tspan><tspan fill="#94a3b8">— the task list collapses to N done / N more</tspan></text><circle cx="91" cy="1025" r="6" fill="#64748b"/><text x="114" y="1033" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">4 </tspan><tspan fill="#94a3b8">— telemetry sheds to a floor of two cells</tspan></text><text x="84" y="1115" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">The floor keeps the clock and the phase label. Is it alive,</text><text x="84" y="1153" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">and what is it doing — that outranks every number.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" fill="#f1f5f9" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="0">RE</text><text x="996" y="1370" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" text-anchor="end">github.com/overkazaf/re-agent</text></svg>