<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f1a2e" stroke-width="1"/></pattern></defs><rect width="1080" height="1440" fill="#020617"/><rect width="1080" height="1440" fill="url(#g)"/><rect x="84" y="96" width="7" height="26" rx="3.5" fill="#34d399"/><text x="106" y="117" fill="#34d399" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="0">LIVE QUEUE</text><text x="996" y="117" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" text-anchor="end">09 / 10</text><text x="84" y="240" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">Do not wait</text><text x="84" y="316" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">for the turn</text><text x="84" y="392" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">to finish.</text><rect x="84" y="520" width="300" height="3" rx="1.5" fill="#34d399"/><text x="84" y="585" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28">While the current reverse task is running, type the</text><text x="84" y="630" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28">next task and press Enter. It lands in a queue instead</text><text x="84" y="675" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28">of stealing the active provider call.</text><circle cx="91" cy="729" r="6" fill="#22d3ee"/><text x="114" y="737" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28"><tspan fill="#f1f5f9" font-weight="700">edit  </tspan><tspan fill="#94a3b8">— rewrite queued work before it starts</tspan></text><circle cx="91" cy="807" r="6" fill="#fb7185"/><text x="114" y="815" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28"><tspan fill="#f1f5f9" font-weight="700">cancel  </tspan><tspan fill="#94a3b8">— drop a bad next task without ^C</tspan></text><circle cx="91" cy="885" r="6" fill="#fbbf24"/><text x="114" y="893" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28"><tspan fill="#f1f5f9" font-weight="700">fold  </tspan><tspan fill="#94a3b8">— collapse or expand the live task list</tspan></text><rect x="84" y="963" width="912" height="171" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/><text x="110" y="1020" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="23" xml:space="preserve"><tspan fill="#22d3ee" font-weight="700">type next prompt + Enter</tspan><tspan fill="#64748b">   queues it</tspan></text><text x="110" y="1060" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="23" xml:space="preserve"><tspan fill="#34d399" font-weight="700">/queue edit 2 triage ./fixed.apk</tspan></text><text x="110" y="1100" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="23" xml:space="preserve"><tspan fill="#fb7185" font-weight="700">/queue cancel 2</tspan><tspan fill="#fbbf24" font-weight="700">      /tasks expand</tspan></text><text x="84" y="1216" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">Approval prompts still own stdin. The queue waits, so a</text><text x="84" y="1254" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">y/n decision never gets swallowed by background capture.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" fill="#f1f5f9" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="0">RE</text><text x="996" y="1370" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" text-anchor="end">github.com/overkazaf/re-agent</text></svg>