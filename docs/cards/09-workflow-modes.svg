<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f1a2e" stroke-width="1"/></pattern></defs><rect width="1080" height="1440" fill="#020617"/><rect width="1080" height="1440" fill="url(#g)"/><rect x="84" y="96" width="7" height="26" rx="3.5" fill="#a78bfa"/><text x="106" y="117" fill="#a78bfa" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="0">WORKFLOW MODES</text><text x="996" y="117" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" text-anchor="end">08 / 10</text><text x="84" y="224" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">Cyber seat</text><text x="84" y="300" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">when you</text><text x="84" y="376" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">have it.</text><text x="84" y="452" fill="#fbbf24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="62" font-weight="700" letter-spacing="0">Caveman when you do not.</text><rect x="84" y="498" width="330" height="3" rx="1.5" fill="#a78bfa"/><text x="84" y="563" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28">If your route is backed by GPT Cyber or CC CVP,</text><text x="84" y="608" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28">0xAF-Re can plan and run the RE task directly.</text><text x="84" y="653" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="28">If not, it delegates through a local evidence runner.</text><circle cx="91" cy="707" r="6" fill="#34d399"/><text x="114" y="715" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="27"><tspan fill="#f1f5f9" font-weight="700">auto  </tspan><tspan fill="#94a3b8">— detect cyber / CVP provider markers</tspan></text><circle cx="91" cy="785" r="6" fill="#22d3ee"/><text x="114" y="793" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="27"><tspan fill="#f1f5f9" font-weight="700">specialist  </tspan><tspan fill="#94a3b8">— plan, use skills, preserve evidence</tspan></text><circle cx="91" cy="863" r="6" fill="#fbbf24"/><text x="114" y="871" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="27"><tspan fill="#f1f5f9" font-weight="700">caveman  </tspan><tspan fill="#94a3b8">— planner -> isolated executor packet</tspan></text><rect x="84" y="941" width="912" height="171" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/><text x="110" y="998" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="23" xml:space="preserve"><tspan fill="#22d3ee" font-weight="700">/workflow auto</tspan><tspan fill="#64748b">        route by provider</tspan></text><text x="110" y="1038" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="23" xml:space="preserve"><tspan fill="#fbbf24" font-weight="700">/workflow caveman</tspan><tspan fill="#64748b">     isolated evidence runner</tspan></text><text x="110" y="1078" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="23" xml:space="preserve"><tspan fill="#22d3ee">0xaf --workflow specialist -p "triage ./app.apk"</tspan></text><text x="84" y="1176" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">Caveman mode is not prompt laundering. The planner keeps</text><text x="84" y="1214" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">the full authorized task; the executor gets only a bounded</text><text x="84" y="1252" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">read-only local evidence packet.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" fill="#f1f5f9" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="0">RE</text><text x="996" y="1370" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" text-anchor="end">github.com/overkazaf/re-agent</text></svg>