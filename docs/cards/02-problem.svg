<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f1a2e" stroke-width="1"/></pattern></defs><rect width="1080" height="1440" fill="#020617"/><rect width="1080" height="1440" fill="url(#g)"/><rect x="84" y="96" width="7" height="26" rx="3.5" fill="#fbbf24"/><text x="106" y="117" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="0">THE PROBLEM</text><text x="996" y="117" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" text-anchor="end">01 / 10</text><text x="84" y="250" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="58" font-weight="700" letter-spacing="0">An agent you</text><text x="84" y="322" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="58" font-weight="700" letter-spacing="0">cannot see is an</text><text x="84" y="394" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="58" font-weight="700" letter-spacing="0">agent you cannot</text><text x="84" y="466" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="58" font-weight="700" letter-spacing="0">trust.</text><rect x="84" y="590" width="280" height="3" rx="1.5" fill="#fbbf24"/><text x="84" y="665" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">Reverse engineering is a long conversation with</text><text x="84" y="715" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">a binary. Two things decide whether an agent is</text><text x="84" y="765" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">useful for it, and neither is the model:</text><circle cx="91" cy="833" r="6" fill="#34d399"/><text x="114" y="841" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">Local tools  </tspan><tspan fill="#94a3b8">— run against the real artifact,</tspan></text><circle cx="91" cy="917" r="6" fill="#22d3ee"/><text x="114" y="925" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29"><tspan fill="#f1f5f9" font-weight="700">Visibility  </tspan><tspan fill="#94a3b8">— enough that you trust the answer</tspan></text><text x="84" y="1007" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">Everything else in the design follows from those two.</text><text x="84" y="1045" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">The rest of this deck is what that forced.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" fill="#f1f5f9" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="0">RE</text><text x="996" y="1370" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" text-anchor="end">github.com/overkazaf/re-agent</text></svg>