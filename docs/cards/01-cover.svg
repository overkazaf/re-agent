<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0f1a2e" stroke-width="1"/></pattern></defs><rect width="1080" height="1440" fill="#020617"/><rect width="1080" height="1440" fill="url(#g)"/><rect x="84" y="96" width="7" height="26" rx="3.5" fill="#22d3ee"/><text x="106" y="117" fill="#22d3ee" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="0">REVERSE OPS DECK</text><text x="84" y="300" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="68" font-weight="700" letter-spacing="0">A reverse</text><text x="84" y="382" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="68" font-weight="700" letter-spacing="0">engineering agent</text><text x="84" y="464" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="68" font-weight="700" letter-spacing="0">that shows its</text><text x="84" y="546" fill="#22d3ee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="68" font-weight="700" letter-spacing="0">work.</text><rect x="84" y="590" width="300" height="3" rx="1.5" fill="#22d3ee"/><text x="84" y="665" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">A planner model and an executor model over</text><text x="84" y="711" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">24 local tools, drawing the turn while it runs —</text><text x="84" y="757" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">so you can see where the time went, and stop it</text><text x="84" y="803" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="29">when it goes somewhere useless.</text><rect x="84" y="879" width="912" height="93" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/><text x="110" y="938" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="25" xml:space="preserve"><tspan fill="#34d399" font-weight="700">$ </tspan><tspan fill="#cbd5e1">0xaf --workspace ./ctf</tspan></text><text x="84" y="1054" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">One static Go binary · 6.7 MB · ~6.7 ms cold start</text><text x="84" y="1092" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue','DejaVu Sans',sans-serif" font-size="24">One external dependency. No runtime to install.</text><line x1="84" y1="1324" x2="996" y2="1324" stroke="#1e293b" stroke-width="1.5"/><rect x="84" y="1348" width="72" height="30" rx="6" fill="#22d3ee"/><text x="120" y="1370" fill="#020617" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" text-anchor="middle">0xAF</text><text x="170" y="1370" fill="#f1f5f9" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="0">RE</text><text x="996" y="1370" fill="#64748b" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="19" text-anchor="end">github.com/overkazaf/re-agent</text></svg>