    <p class="sub">
      七张图说明 0xAF-Re 的真实运行方式：包分层、单轮请求、上下文预算、审批闸门、
      实时面板、oh-my-pi 参考结构，以及两者的取舍差异。
    </p>
  </header>

  <nav>
    <a href="#module-graph">1 · 模块图</a>
    <a href="#one-turn">2 · 单轮时序</a>

  <figure id="module-graph">
    <div class="fig-head"><span class="num">01</span><h2>模块依赖图</h2></div>
    <figcaption>说明每个 internal 包的边界和导入方向。依赖向下流动，`types` 和 `util` 保持叶子层，避免循环依赖。</figcaption>
    <div class="frame"><img src="01-module-graph.svg" alt="0xAF-Re 模块依赖图"></div>
    <p class="src"><a href="01-module-graph.svg">打开 SVG &rarr;</a></p>
  </figure>

  <figure id="one-turn">
    <div class="fig-head"><span class="num">02</span><h2>单轮请求</h2></div>
    <figcaption>从 operator 输入到 provider 请求、assistant 回复、tool call、approval、tool result，再回到下一 turn 的完整链路。</figcaption>
    <div class="frame"><img src="02-one-turn.svg" alt="0xAF-Re 单轮请求时序图"></div>
    <p class="src"><a href="02-one-turn.svg">打开 SVG &rarr;</a></p>
  </figure>

  <figure id="context-budget">
    <div class="fig-head"><span class="num">03</span><h2>上下文预算</h2></div>
    <figcaption>磁盘 transcript 保留完整记录；发送给模型的上下文会压缩旧消息、摘要大输出，并保留可重新读取的 artifact 路径。</figcaption>
    <div class="frame"><img src="03-context-budget.svg" alt="0xAF-Re 上下文预算图"></div>
    <p class="src"><a href="03-context-budget.svg">打开 SVG &rarr;</a></p>
  </figure>

  <figure id="approval-gate">
    <div class="fig-head"><span class="num">04</span><h2>审批闸门</h2></div>
    <figcaption>模型 tool call、MCP tool 和手动 shell escape 都经过同一套 tier x mode 策略。</figcaption>
    <div class="frame"><img src="04-approval-gate.svg" alt="0xAF-Re 审批闸门图"></div>
    <p class="src"><a href="04-approval-gate.svg">打开 SVG &rarr;</a></p>
  </figure>

  <figure id="live-pane">
    <div class="fig-head"><span class="num">05</span><h2>实时面板</h2></div>
    <figcaption>UI 只消费 `core.LoopEvent`，展示 role、provider、phase、工具、任务进度、耗时和 token 信息。</figcaption>
    <div class="frame"><img src="05-live-pane.svg" alt="0xAF-Re 实时面板图"></div>
    <p class="src"><a href="05-live-pane.svg">打开 SVG &rarr;</a></p>
  </figure>

  <figure id="oh-my-pi">
    <div class="fig-head"><span class="num">06</span><h2>oh-my-pi 参考结构</h2></div>
    <figcaption>记录 0xAF-Re 借鉴的事件循环、工具 registry、输出预算和审批思路，以及没有继承的平台级能力。</figcaption>
    <div class="frame"><img src="06-oh-my-pi.svg" alt="oh-my-pi 架构参考图"></div>
    <p class="src"><a href="06-oh-my-pi.svg">打开 SVG &rarr;</a></p>
  </figure>

  <figure id="comparison">
    <div class="fig-head"><span class="num">07</span><h2>0xAF-Re vs oh-my-pi</h2></div>
    <figcaption>对比两个项目的定位：oh-my-pi 更像平台，0xAF-Re 更像面向本地授权逆向任务的单二进制工具。</figcaption>
    <div class="frame"><img src="07-vs-oh-my-pi.svg" alt="0xAF-Re 和 oh-my-pi 对比图"></div>
    <p class="src"><a href="07-vs-oh-my-pi.svg">打开 SVG &rarr;</a></p>
