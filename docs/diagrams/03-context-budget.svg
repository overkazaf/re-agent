<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1500" width="1120" height="1500" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ah-ok" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="ah-warn" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1120" height="1500" fill="#020617"/>
  <rect width="1120" height="1500" fill="url(#grid)"/>

  <text x="40" y="42" fill="#e2e8f0" font-size="17" font-weight="700">The context budget</text>
  <text x="40" y="62" fill="#64748b" font-size="10">CompactHistory — two passes and a floor. The disk record stays whole; only the view sent upstream is trimmed.</text>

  <!-- ===== EDGES (behind boxes) ===== -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#ah)">
    <path d="M 530 138 L 530 154"/>
    <path d="M 530 234 L 530 262"/>
    <path d="M 530 322 L 530 348"/>
    <path d="M 530 424 L 530 450"/>
    <path d="M 530 526 L 530 552"/>
    <path d="M 530 616 L 530 642"/>
    <path d="M 530 734 L 530 774"/>
    <path d="M 530 854 L 530 892"/>
    <path d="M 530 972 L 530 1006"/>
    <path d="M 350 816 L 316 816"/>
    <path d="M 350 934 L 316 934"/>
  </g>

  <!-- yes → unchanged -->
  <g stroke="#34d399" stroke-width="1.4" fill="none" marker-end="url(#ah-ok)">
    <path d="M 700 196 L 806 196"/>
  </g>

  <!-- no → emit -->
  <g stroke="#34d399" stroke-width="1.4" fill="none" marker-end="url(#ah-ok)">
    <path d="M 720 690 L 826 690"/>
  </g>

  <!-- merged loop-back rail: I and K both re-test the budget -->
  <g stroke="#fb923c" stroke-width="1.4" fill="none" marker-end="url(#ah-warn)">
    <path d="M 70 818 L 32 818 L 32 690 L 336 690"/>
  </g>
  <g stroke="#fb923c" stroke-width="1.4" fill="none">
    <path d="M 70 936 L 32 936 L 32 818"/>
  </g>

  <!-- L → emit (far right rail) -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#ah)">
    <path d="M 750 1044 L 790 1044 L 790 762 L 946 762 L 946 720"/>
  </g>

  <!-- emit → anything dropped? -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#ah)">
    <path d="M 1066 690 L 1090 690 L 1090 1164 L 706 1164"/>
  </g>

  <!-- M → N / O -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#ah)">
    <path d="M 360 1164 L 200 1164 L 200 1232"/>
    <path d="M 530 1200 L 530 1216 L 740 1216 L 740 1232"/>
    <path d="M 270 1316 L 270 1340 L 400 1340 L 400 1352"/>
    <path d="M 740 1292 L 740 1340 L 660 1340 L 660 1352"/>
  </g>

  <!-- ===== NODES ===== -->
  <!-- A -->
  <rect x="330" y="88" width="400" height="50" rx="6" fill="#0f172a"/>
  <rect x="330" y="88" width="400" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="112" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">CompactHistory(messages, budget)</text>
  <text x="530" y="128" fill="#94a3b8" font-size="9" text-anchor="middle">called once per turn, before the provider sees anything</text>

  <!-- B decision -->
  <polygon points="530,158 700,196 530,234 360,196" fill="#0f172a"/>
  <polygon points="530,158 700,196 530,234 360,196" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="530" y="194" fill="#f1f5f9" font-size="10" font-weight="600" text-anchor="middle">HistoryTokens</text>
  <text x="530" y="208" fill="#cbd5e1" font-size="9" text-anchor="middle">within budget?</text>

  <!-- Z -->
  <rect x="806" y="172" width="274" height="48" rx="6" fill="#0f172a"/>
  <rect x="806" y="172" width="274" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="943" y="194" fill="#f1f5f9" font-size="10" font-weight="700" text-anchor="middle">return the list unchanged</text>
  <text x="943" y="209" fill="#94a3b8" font-size="9" text-anchor="middle">elided = 0 · dropped = 0</text>

  <!-- C -->
  <rect x="310" y="262" width="440" height="60" rx="6" fill="#0f172a"/>
  <rect x="310" y="262" width="440" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="286" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">protectedFrom = len − keepRecent</text>
  <text x="530" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">keepRecent defaults to 8 — a preference, not a floor</text>

  <!-- D -->
  <rect x="270" y="348" width="520" height="76" rx="6" fill="#0f172a"/>
  <rect x="270" y="348" width="520" height="76" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="372" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">PASS 1 — ELIDE OLD TOOL RESULTS</text>
  <text x="530" y="392" fill="#e2e8f0" font-size="9" text-anchor="middle">every message before protectedFrom</text>
  <text x="530" y="408" fill="#94a3b8" font-size="9" text-anchor="middle">with role toolResult and text over 400 chars</text>

  <!-- E -->
  <rect x="270" y="450" width="520" height="76" rx="6" fill="#0f172a"/>
  <rect x="270" y="450" width="520" height="76" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="474" fill="#f1f5f9" font-size="10" font-weight="700" text-anchor="middle">body replaced by a one-line note</text>
  <text x="530" y="493" fill="#94a3b8" font-size="9" text-anchor="middle">"older TOOL result elided, N chars, first line …"</text>
  <text x="530" y="510" fill="#34d399" font-size="9" text-anchor="middle">the assistant call and its arguments survive</text>

  <!-- F -->
  <rect x="270" y="552" width="520" height="64" rx="6" fill="#0f172a"/>
  <rect x="270" y="552" width="520" height="64" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="576" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">PASS 2 — DROP WHOLE EXCHANGES</text>
  <text x="530" y="596" fill="#94a3b8" font-size="9" text-anchor="middle">hardFloor = index of the last user message</text>

  <!-- G decision -->
  <polygon points="530,642 720,690 530,738 340,690" fill="#0f172a"/>
  <polygon points="530,642 720,690 530,738 340,690" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="530" y="684" fill="#f1f5f9" font-size="10" font-weight="600" text-anchor="middle">still over budget?</text>
  <text x="530" y="700" fill="#94a3b8" font-size="8" text-anchor="middle">kept tail + the marker</text>

  <!-- Y emit -->
  <rect x="826" y="666" width="240" height="48" rx="6" fill="#0f172a"/>
  <rect x="826" y="666" width="240" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="946" y="695" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">emit</text>

  <!-- H decision -->
  <polygon points="530,778 710,816 530,854 350,816" fill="#0f172a"/>
  <polygon points="530,778 710,816 530,854 350,816" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="530" y="812" fill="#f1f5f9" font-size="10" font-weight="600" text-anchor="middle">cursor still before</text>
  <text x="530" y="826" fill="#cbd5e1" font-size="9" text-anchor="middle">protectedFrom?</text>

  <!-- I -->
  <rect x="70" y="790" width="246" height="56" rx="6" fill="#0f172a"/>
  <rect x="70" y="790" width="246" height="56" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="193" y="812" fill="#f1f5f9" font-size="10" font-weight="700" text-anchor="middle">cursor = nextBoundary</text>
  <text x="193" y="829" fill="#94a3b8" font-size="8" text-anchor="middle">one message + all of its tool results</text>

  <!-- J decision -->
  <polygon points="530,896 710,934 530,972 350,934" fill="#0f172a"/>
  <polygon points="530,896 710,934 530,972 350,934" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="530" y="930" fill="#f1f5f9" font-size="10" font-weight="600" text-anchor="middle">cursor still before</text>
  <text x="530" y="944" fill="#cbd5e1" font-size="9" text-anchor="middle">hardFloor?</text>

  <!-- K -->
  <rect x="70" y="908" width="246" height="56" rx="6" fill="#0f172a"/>
  <rect x="70" y="908" width="246" height="56" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="193" y="930" fill="#f1f5f9" font-size="10" font-weight="700" text-anchor="middle">eat into keep-recent</text>
  <text x="193" y="947" fill="#94a3b8" font-size="8" text-anchor="middle">a preference, not a floor</text>

  <!-- L -->
  <rect x="310" y="1006" width="440" height="76" rx="6" fill="#0f172a"/>
  <rect x="310" y="1006" width="440" height="76" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="530" y="1030" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">LAST-EXCHANGE FLOOR</text>
  <text x="530" y="1050" fill="#e2e8f0" font-size="9" text-anchor="middle">stop over budget rather than</text>
  <text x="530" y="1066" fill="#e2e8f0" font-size="9" text-anchor="middle">delete the turn being answered</text>

  <!-- M decision -->
  <polygon points="530,1128 700,1164 530,1200 360,1164" fill="#0f172a"/>
  <polygon points="530,1128 700,1164 530,1200 360,1164" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="530" y="1168" fill="#f1f5f9" font-size="10" font-weight="600" text-anchor="middle">anything dropped?</text>

  <!-- N -->
  <rect x="30" y="1232" width="480" height="84" rx="6" fill="#0f172a"/>
  <rect x="30" y="1232" width="480" height="84" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="270" y="1256" fill="#f1f5f9" font-size="10" font-weight="700" text-anchor="middle">prepend one CompactionMarker user message</text>
  <text x="270" y="1275" fill="#94a3b8" font-size="9" text-anchor="middle">count dropped · last 6 prompts · tool names used</text>
  <text x="270" y="1292" fill="#a78bfa" font-size="9" text-anchor="middle">plus "full transcript is on disk"</text>
  <text x="270" y="1308" fill="#64748b" font-size="8" text-anchor="middle">the model is told what it can no longer see</text>

  <!-- O -->
  <rect x="590" y="1232" width="300" height="60" rx="6" fill="#0f172a"/>
  <rect x="590" y="1232" width="300" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="740" y="1258" fill="#f1f5f9" font-size="10" font-weight="700" text-anchor="middle">kept messages only</text>
  <text x="740" y="1275" fill="#94a3b8" font-size="9" text-anchor="middle">no marker needed</text>

  <!-- P -->
  <rect x="250" y="1352" width="560" height="76" rx="6" fill="#0f172a"/>
  <rect x="250" y="1352" width="560" height="76" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="530" y="1378" fill="#f1f5f9" font-size="11" font-weight="700" text-anchor="middle">CompactionResult</text>
  <text x="530" y="1398" fill="#94a3b8" font-size="9" text-anchor="middle">Messages · TokensBefore · TokensAfter</text>
  <text x="530" y="1415" fill="#94a3b8" font-size="9" text-anchor="middle">ElidedToolResults · DroppedMessages</text>

  <!-- edge labels -->
  <g font-size="9" font-weight="700">
    <text x="712" y="190" fill="#34d399">yes</text>
    <text x="542" y="252" fill="#94a3b8">no</text>
    <text x="732" y="684" fill="#34d399">no</text>
    <text x="542" y="762" fill="#94a3b8">yes</text>
    <text x="333" y="808" fill="#fb923c" font-size="8" text-anchor="middle">yes</text>
    <text x="542" y="880" fill="#94a3b8">no</text>
    <text x="333" y="926" fill="#fb923c" font-size="8" text-anchor="middle">yes</text>
    <text x="542" y="996" fill="#94a3b8">no</text>
    <text x="210" y="1158" fill="#94a3b8" text-anchor="end">yes</text>
    <text x="560" y="1212" fill="#94a3b8">no</text>
  </g>

  <text x="40" y="1464" fill="#475569" font-size="8">Order matters: eliding tool bodies is tried before dropping exchanges, because a tool call stripped of its result would leave the transcript unresumable. The</text>
  <text x="40" y="1480" fill="#475569" font-size="8">last-exchange floor is the one place the budget is allowed to lose — deleting the turn currently being answered is worse than going over.</text>
</svg>
